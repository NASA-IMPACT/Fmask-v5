name: Publish conda package
description: >
  Build the conda package and publish it to a channel in the project S3
  bucket. Expects the repository to be checked out with full history, and the
  job to have the id-token: write permission for OIDC.

inputs:
  channel:
    description: Channel name under the bucket, e.g. stable or dev.
    required: true
  bucket:
    description: S3 bucket holding the conda channels (no s3:// prefix).
    required: true
  role-to-assume:
    description: ARN of the AWS role to assume via OIDC.
    required: true
  aws-region:
    description: AWS region of the bucket.
    required: true
  require-release-version:
    description: Fail unless the checkout resolves to a release version (no dev or local part).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.83.0
        environments: build
        locked: true

    - name: Check release version
      if: inputs.require-release-version == 'true'
      shell: bash
      run: |
        version=$(pixi run --environment build python -m setuptools_scm)
        echo "Version: $version"
        case "$version" in
          *dev*|*+*)
            echo "::error::$GITHUB_REF_NAME resolved to non-release version $version"
            exit 1
            ;;
        esac

    - name: Build conda package
      shell: bash
      run: pixi run --environment build build-conda

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: gha-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Upload package and index channel
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        CHANNEL: s3://${{ inputs.bucket }}/${{ inputs.channel }}
        # rattler-build upload s3 / rattler-index s3 use S3_* vars
        S3_REGION: ${{ inputs.aws-region }}
        S3_ENDPOINT_URL: https://s3.${{ inputs.aws-region }}.amazonaws.com
      run: |
        set -euo pipefail
        pixi run --environment build rattler-build auth login "s3://$BUCKET" \
          --s3-access-key-id "$AWS_ACCESS_KEY_ID" \
          --s3-secret-access-key "$AWS_SECRET_ACCESS_KEY" \
          --s3-session-token "$AWS_SESSION_TOKEN"
        # Without --force, upload fails rather than replacing a published version
        pixi run --environment build rattler-build upload s3 \
          --channel "$CHANNEL" dist/noarch/*.conda
        pixi exec rattler-index s3 "$CHANNEL"

    - name: Write job summary
      shell: bash
      env:
        CHANNEL: s3://${{ inputs.bucket }}/${{ inputs.channel }}
      run: |
        set -euo pipefail
        {
          echo "### Published conda package"
          echo
          echo "Channel: \`$CHANNEL\`"
          echo
          echo "| Package | Version | Build | File |"
          echo "| --- | --- | --- | --- |"
          for f in dist/noarch/*.conda; do
            # <name>-<version>-<build>.conda; names may contain dashes
            base=$(basename "$f" .conda)
            build=${base##*-}
            rest=${base%-*}
            version=${rest##*-}
            name=${rest%-*}
            echo "| \`$name\` | \`$version\` | \`$build\` | \`$(basename "$f")\` |"
            pin="$name = \"=$version\""
          done
          echo
          echo "pixi.toml, with \`$CHANNEL\` in the workspace channels:"
          echo
          echo '```toml'
          echo "$pin"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
