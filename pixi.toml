[workspace]
name = "fmask"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
preview = ["pixi-build"]
conda-pypi-map = { conda-forge = "conda-pypi-map.json" }

[dependencies]
python = ">=3.10"
gdal = "*"
libgdal-jp2openjpeg = "*"
rasterio = "*"
numpy = ">=1.22"
scipy = "*"
pandas = "*"
scikit-image = "*"
scikit-learn = "*"
pytorch = "*"
matplotlib = "*"
plotly = "*"
nbformat = "*"
pyproj = "*"
click = "*"
lxml = "*"
geopandas = "*"
lightgbm = "*"
utm = "*"
segmentation-models-pytorch = "*"

[pypi-dependencies]
fmask = { path = ".", editable = true }

[feature.test.dependencies]
pytest = "*"

[feature.build.dependencies]
python = ">=3.10"
rattler-build = "*"
setuptools-scm = "*"

[feature.build.tasks]
build-conda = "FMASK_VERSION=$(python -m setuptools_scm) rattler-build build --recipe recipe/ --output-dir dist/ -c conda-forge"

[environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
build = { features = ["build"], no-default-feature = true }

[package]
name = "fmask"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "*" }
