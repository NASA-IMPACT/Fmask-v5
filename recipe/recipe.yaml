context:
  # FMASK_VERSION is set by the build-conda task. Builds that do not set it
  # (e.g. pixi source dependencies) fall back to the latest git tag, which
  # requires rattler-build's experimental mode. Commits after the tag get a
  # "+g<hash>" suffix; rattler-build cannot count commits or detect a dirty tree.
  git_tag: ${{ git.latest_tag("..") }}
  git_suffix: ${{ "" if git.head_rev("..") == git.latest_tag_rev("..") else "+g" ~ git.head_rev("..")[:9] }}
  version: ${{ env.get("FMASK_VERSION", default=(git_tag | replace("v", "")) ~ git_suffix) }}

package:
  name: fmask
  version: ${{ version }}

source:
  - path: ..

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=3.10
    - click
    - gdal
    - libgdal-jp2openjpeg
    - geopandas
    - lightgbm
    - lxml
    - matplotlib
    - nbformat
    - numpy
    - pandas
    - plotly
    - pyproj
    - pytorch
    - rasterio
    - scikit-image
    - scikit-learn
    - scipy
    - segmentation-models-pytorch
    - utm

tests:
  - python:
      imports:
        - fmask
        - fmask.bitlib
        - fmask.constant
        - fmask.fmasklib
        - fmask.phylib
        - fmask.satellite
        - fmask.utils
      pip_check: false
  - script:
      - fmask --help
      - fmask-batch --help
      - fmask-data --help
      - python -c "import importlib.metadata as m, fmask; assert m.version('fmask') == fmask.__version__ == '${{ version }}', fmask.__version__"

about:
  homepage: https://github.com/gersl/fmask
  license: MIT
  license_file: LICENSE
  summary: Cloud and cloud shadow detection for Landsat 4-9 and Sentinel-2
  description: |
    Fmask 5 is a Physics-Informed Machine Learning framework for automated
    cloud and cloud shadow detection in Landsat 4-9 Collection 2 Level 1
    and Sentinel-2 Level-1C imagery.
